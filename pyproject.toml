[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peg_this"
version = "4.2.0"
authors = [
  { name="Hariharen S S", email="thisishariharen@gmail.com" },
]
description = "A powerful and intuitive command-line multimedia editor suite for video, audio, and image processing, built on FFmpeg."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "ffmpeg", "video", "audio", "image", "multimedia", "editor", "suite", "cli", "tui",
    "converter", "subtitles", "whisper", "transcription", "trim", "crop", "compress",
    "batch", "automation", "processing", "effects", "filters"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities"
]
dependencies = [
    "ffmpeg-python==0.2.0",
    "questionary>=2.0.0",
    "rich>=13.0.0",
    "Pillow>=9.0.0",
    "faster-whisper>=1.0.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "rembg>=2.0.50",
    "onnxruntime>=1.16.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

[project.urls]
"Repository" = "https://github.com/hariharen9/ffmpeg-this"
"Changelog" = "https://github.com/hariharen9/ffmpeg-this/releases"
"Issues" = "https://github.com/hariharen9/ffmpeg-this/issues"
"Sponsor" = "https://github.com/sponsors/hariharen9"

[project.scripts]
peg_this = "peg_this.peg_this:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peg_this = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"